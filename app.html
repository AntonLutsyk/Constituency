<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Constituency.ie — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="dc-src"><x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#F6F6F3;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#004D44;text-decoration:none}a:hover{color:#00322B}
button,input,select,textarea{font-family:Lato,Arial,sans-serif}
:focus-visible{outline:2px solid #FDDA0D;outline-offset:2px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</helmet>
<div style="min-height:100vh;background:#F6F6F3;font:400 15px/1.55 Lato,Arial,sans-serif;color:#3F3B34;display:flex">

<sc-if value="{{ sideOverlay }}" hint-placeholder-val="{{ false }}"><div onClick="{{ closeSide }}" style="position:fixed;inset:0;background:rgba(0,34,29,.45);z-index:45;animation:fadeIn .15s"></div></sc-if>
<aside aria-label="App navigation" style="position:sticky;position:{{ sidePos }};top:0;align-self:flex-start;left:0;bottom:0;z-index:50;width:268px;flex-shrink:0;height:100vh;background:#00322B;color:#fff;display:flex;flex-direction:column;padding:24px 16px 20px;transform:{{ sideX }};transition:transform .25s ease">
  <a onClick="{{ goSite }}" aria-label="Constituency.ie website" style="display:flex;padding:0 8px;cursor:pointer"><img src="assets/logo-v2.png" alt="Constituency" style="height:40px;width:auto;display:block"></a>
  <div style="margin:22px 8px 0;display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font:700 11px/1 Lato,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#C9B98A;background:rgba(255,255,255,.06);border:1px solid rgba(201,185,138,.3);padding:7px 10px;border-radius:999px"><span style="width:6px;height:6px;border-radius:50%;background:#C9B98A"></span>{{ roleLabel }}</div>
  <nav style="margin-top:20px;display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
      <a onClick="{{ n.go }}" aria-current="{{ n.current }}" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;cursor:pointer;font:700 14px Lato,Arial,sans-serif;color:{{ n.fg }};background:{{ n.bg }};box-shadow:{{ n.bar }};transition:background .15s,color .15s" style-hover="background:rgba(255,255,255,.08);color:#fff"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="{{ n.icon }}"></path></svg><span style="flex:1">{{ n.label }}</span><sc-if value="{{ n.hasCount }}" hint-placeholder-val="{{ false }}"><span style="font:700 11px/1 Lato,Arial,sans-serif;color:#00322B;background:#C9B98A;border-radius:999px;padding:4px 7px">{{ n.count }}</span></sc-if></a>
    </sc-for>
  </nav>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)">
    <a onClick="{{ goSite }}" style="display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;cursor:pointer;font:700 14px Lato,Arial,sans-serif;color:rgba(255,255,255,.75)" style-hover="background:rgba(255,255,255,.08);color:#fff"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path></svg>Back to website</a>
    <a onClick="{{ logout }}" style="display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;cursor:pointer;font:700 14px Lato,Arial,sans-serif;color:rgba(255,255,255,.75)" style-hover="background:rgba(255,255,255,.08);color:#fff"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Log out</a>
    <div style="margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06)"><img src="{{ userAv }}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(201,185,138,.5)"><div style="min-width:0"><div style="font:700 14px/1.3 Lato,Arial,sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ userName }}</div><div style="font:400 12px/1.3 Lato,Arial,sans-serif;color:rgba(255,255,255,.65)">{{ roleLabel }}</div></div></div>
  </div>
</aside>

<div style="flex:1;min-width:0;display:flex;flex-direction:column">
  <header style="position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,40px);background:rgba(246,246,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid #ECE9E1">
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}"><button onClick="{{ openSide }}" aria-label="Open menu" style="width:44px;height:44px;margin-left:-8px;border:0;background:transparent;color:#00322B;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button></sc-if>
    <nav aria-label="Breadcrumb" style="display:flex;align-items:center;gap:8px;font:400 14px/1 Lato,Arial,sans-serif;color:#6B665C;min-width:0"><span style="white-space:nowrap">{{ roleLabel }}</span><span aria-hidden="true">/</span><span style="color:#00322B;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ crumb }}</span></nav>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <label style="display:flex;align-items:center;gap:8px"><span style="font:400 13px Lato,Arial,sans-serif;color:#6B665C;white-space:nowrap">{{ viewingAs }}</span><span style="position:relative;display:block"><select onChange="{{ onRole }}" value="{{ role }}" aria-label="Switch role" style="appearance:none;-webkit-appearance:none;height:38px;padding:0 32px 0 12px;border:1px solid #DEDBD2;border-radius:8px;background:#fff;font:700 13px Lato,Arial,sans-serif;color:#00322B;cursor:pointer"><option value="citizen">Citizen</option><option value="rep">Representative</option><option value="owner">Platform owner</option></select><span style="position:absolute;right:10px;top:11px;pointer-events:none;color:#565148;display:flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m6 9 6 6 6-6"></path></svg></span></span></label>
      <button onClick="{{ bell }}" aria-label="Notifications" style="position:relative;width:40px;height:40px;border-radius:50%;border:1px solid #DEDBD2;background:#fff;color:#00322B;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="border-color:#004D44"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#C49A2C;border:2px solid #fff"></span></button>
    </div>
  </header>

  <main style="flex:1;width:100%;max-width:1360px;margin:0 auto;padding:clamp(20px,3vw,36px) clamp(16px,3vw,40px) 64px" key="{{ pageKey }}">
    <sc-if value="{{ showHeader }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;animation:pageIn .3s ease-out">
      <div><h1 style="margin:0;font:600 clamp(28px,2.8vw,38px)/1.12 'Source Serif 4',Georgia,serif;color:#00322B;letter-spacing:-.015em">{{ pageTitle }}</h1><p style="margin:6px 0 0;font:400 15px/1.5 Lato,Arial,sans-serif;color:#6B665C">{{ pageSub }}</p></div>
      <sc-if value="{{ showRange }}" hint-placeholder-val="{{ false }}"><div role="tablist" style="display:inline-flex;flex-wrap:wrap;background:#EDECE5;border-radius:10px;padding:4px;gap:2px"><sc-for list="{{ rangeTabs }}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.go }}" style="height:36px;padding:0 14px;border:0;border-radius:7px;background:{{ t.bg }};color:{{ t.fg }};font:700 13px Lato,Arial,sans-serif;cursor:pointer;transition:background .15s">{{ t.label }}</button></sc-for></div></sc-if>
      <sc-if value="{{ isCitCases }}" hint-placeholder-val="{{ false }}"><button onClick="{{ goSubmit }}" style="height:44px;padding:0 18px;background:#004D44;color:#fff;border:0;border-radius:8px;font:700 14px Lato,Arial,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s" style-hover="background:#00322B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 5v14M5 12h14"></path></svg>New case</button></sc-if>
    </div></sc-if>

<!-- CASES (citizen + rep) -->
<sc-if value="{{ isCases }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:20px;animation:pageIn .3s ease-out">
    <sc-if value="{{ isCitCases }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:16px">
        <sc-for list="{{ citKpis }}" as="k" hint-placeholder-count="4">
          <div style="background:#fff;border:1px solid #ECE9E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,50,43,.04),0 6px 20px -8px rgba(0,50,43,.08);padding:18px 20px;background:{{ k.bg }}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font:700 13px/1.3 Lato,Arial,sans-serif;color:#3F3B34">{{ k.label }}</span><span style="width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.7);color:{{ k.fg }};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="{{ k.icon }}"></path></svg></span></div>
            <div style="margin-top:10px;font:600 32px/1 'Source Serif 4',Georgia,serif;color:{{ k.fg }};letter-spacing:-.01em">{{ k.value }}</div>
            <div style="margin-top:6px;font:400 12px/1.4 Lato,Arial,sans-serif;color:#6B665C">{{ k.sub }}</div>
          </div>
        </sc-for>
      </div></sc-if>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;flex:1 1 auto"><label style="position:relative;display:block;flex:1 1 260px;max-width:420px"><span style="position:absolute;left:-9999px">Search by title, ID or town</span><span style="position:absolute;left:14px;top:13px;color:#6B665C;display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"></path></svg></span><input type="search" value="{{ q }}" onInput="{{ onQ }}" placeholder="Search by title, ID or town" style="width:100%;height:44px;padding:0 14px;border:1px solid #DEDBD2;border-radius:8px;background:#fff;font:400 15px Lato,Arial,sans-serif;color:#00322B;transition:border-color .15s,box-shadow .15s;padding-left:42px" style-focus="border-color:#004D44;box-shadow:0 0 0 3px rgba(0,77,68,.15)"></label><div role="tablist" style="display:inline-flex;flex-wrap:wrap;background:#EDECE5;border-radius:10px;padding:4px;gap:2px"><sc-for list="{{ statusTabs }}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.go }}" style="height:36px;padding:0 14px;border:0;border-radius:7px;background:{{ t.bg }};color:{{ t.fg }};font:700 13px Lato,Arial,sans-serif;cursor:pointer;transition:background .15s">{{ t.label }}</button></sc-for></div></div>
      <div role="tablist" style="display:inline-flex;flex-wrap:wrap;background:#EDECE5;border-radius:10px;padding:4px;gap:2px"><sc-for list="{{ viewTabs }}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.go }}" style="height:36px;padding:0 14px;border:0;border-radius:7px;background:{{ t.bg }};color:{{ t.fg }};font:700 13px Lato,Arial,sans-serif;cursor:pointer;transition:background .15s">{{ t.label }}</button></sc-for></div>
    </div>
    <sc-if value="{{ noCases }}" hint-placeholder-val="{{ false }}"><div style="background:#fff;border:1px solid #ECE9E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,50,43,.04),0 6px 20px -8px rgba(0,50,43,.08);padding:48px 24px;text-align:center"><h3 style="margin:0;font:600 18px/1.3 'Source Serif 4',Georgia,serif;color:#00322B">No cases match</h3><p style="margin:8px 0 0;color:#6B665C">Try a different search or status.</p></div></sc-if>
    <sc-if value="{{ showList }}" hint-placeholder-val="{{ true }}">
      <div style="background:#fff;border:1px solid #ECE9E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,50,43,.04),0 6px 20px -8px rgba(0,50,43,.08);overflow:hidden"><div style="overflow-x:auto"><table style="width:100%;min-width:820px;border-collapse:collapse;font:400 14px/1.4 Lato,Arial,sans-serif">
        <thead><tr><th scope="col" style="text-align:left;padding:12px 20px;font:700 12px/1 Lato,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6B665C;background:#FAFAF8;border-bottom:1px solid #ECE9E1;white-space:nowrap">Case</th><th scope="col" style="text-align:left;padding:12px 20px;font:700 12px/1 Lato,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6B665C;background:#FAFAF8;border-bottom:1px solid #ECE9E1;white-space:nowrap">{{ personCol }}</th><th scope="col" style="text-align:left;padding:12px 20px;font:700 12px/1 Lato,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6B665C;background:#FAFAF8;border-bottom:1px solid #ECE9E1;white-space:nowrap">Status</th><th scope="col" style="text-align:left;padding:12px 20px;font:700 12px/1 Lato,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6B665C;background:#FAFAF8;border-bottom:1px solid #ECE9E1;white-space:nowrap">Location</th><th scope="col" style="text-align:left;padding:12px 20px;font:700 12px/1 Lato,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6B665C;background:#FAFAF8;border-bottom:1px solid #ECE9E1;white-space:nowrap">Created</th><th scope="col" style="text-align:left;padding:12px 20px;font:700 12px/1 Lato,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6B665C;background:#FAFAF8;border-bottom:1px solid #ECE9E1;white-space:nowrap"><span style="position:absolute;left:-9999px">Actions</span></th></tr></thead>
        <tbody><sc-for list="{{ caseRows }}" as="c" hint-placeholder-count="6">
          <tr onClick="{{ c.open }}" style="cursor:pointer;transition:background .15s" style-hover="background:#FAFAF8">
            <td style="padding:14px 20px;border-bottom:1px solid #F1EFEA;color:#00322B;vertical-align:middle"><div style="display:flex;align-items:center;gap:12px"><img src="{{ c.img }}" alt="" style="width:48px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0"><div style="min-width:0"><div style="font:700 14px/1.3 Lato,Arial,sans-serif;color:#00322B">{{ c.title }}</div><div style="font:400 12px/1.4 Lato,Arial,sans-serif;color:#6B665C">#{{ c.id }} · {{ c.cat }}</div></div></div></td>
            <td style="padding:14px 20px;border-bottom:1px solid #F1EFEA;color:#00322B;vertical-align:middle">{{ c.person }}</td>
            <td style="padding:14px 20px;border-bottom:1px solid #F1EFEA;color:#00322B;vertical-align:middle"><span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font:700 12px/1 Lato,Arial,sans-serif;padding:6px 10px;border-radius:999px;color:{{ c.stFg }};background:{{ c.stBg }}"><span style="width:6px;height:6px;border-radius:50%;background:{{ c.stDot }}"></span>{{ c.status }}</span><sc-if value="{{ c.overdue }}" hint-placeholder-val="{{ false }}"><span style="margin-left:6px;font:700 11px/1 Lato,Arial,sans-serif;color:#A12B2B;background:#FDECEC;padding:5px 7px;border-radius:999px">Overdue</span></sc-if></td>
            <td style="padding:14px 20px;border-bottom:1px solid #F1EFEA;color:#00322B;vertical-align:middle;color:#565148">{{ c.town }}, Co. {{ c.county }}</td>
            <td style="padding:14px 20px;border-bottom:1px solid #F1EFEA;color:#00322B;vertical-align:middle;color:#565148;white-space:nowrap">{{ c.date }}</td>
            <td style="padding:14px 20px;border-bottom:1px solid #F1EFEA;color:#00322B;vertical-align:middle;text-align:right"><button onClick="{{ c.open }}" style="height:44px;padding:0 16px;background:#fff;color:#00322B;border:1px solid #DEDBD2;border-radius:8px;font:700 14px Lato,Arial,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:border-color .15s;height:36px;padding:0 12px;font-size:13px" style-hover="border-color:#004D44">View case</button></td>
          </tr>
        </sc-for></tbody></table></div></div>
    </sc-if>
    <sc-if value="{{ showBoard }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px">
          <sc-for list="{{ boardCols }}" as="col" hint-placeholder-count="4">
            <section style="background:#EFEEE9;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px">
              <header style="display:flex;align-items:center;gap:8px;padding:4px 4px 2px"><span style="width:8px;height:8px;border-radius:50%;background:{{ col.dot }}"></span><h3 style="margin:0;font:700 14px/1 Lato,Arial,sans-serif;color:#00322B">{{ col.name }}</h3><span style="margin-left:auto;font:700 12px/1 Lato,Arial,sans-serif;color:#565148;background:#fff;border-radius:999px;padding:5px 8px">{{ col.count }}</span></header>
              <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="1">
                <article onClick="{{ c.open }}" onKeyDown="{{ c.key }}" tabIndex="0" aria-label="{{ c.title }}" style="background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,50,43,.05);transition:box-shadow .2s,transform .2s" style-hover="box-shadow:0 2px 4px rgba(0,50,43,.04),0 14px 28px -14px rgba(0,50,43,.28);transform:translateY(-2px)">
                  <div style="position:relative"><img src="{{ c.img }}" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;display:block"><span style="position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;font:700 11px/1 Lato,Arial,sans-serif;color:{{ c.stFg }};background:{{ c.stBg }};padding:5px 8px;border-radius:5px"><span style="width:6px;height:6px;border-radius:50%;background:{{ c.stDot }}"></span>{{ c.status }}</span><sc-if value="{{ c.overdue }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:10px;top:10px;font:700 11px/1 Lato,Arial,sans-serif;color:#A12B2B;background:#FDECEC;padding:5px 7px;border-radius:5px">Overdue</span></sc-if></div>
                  <div style="padding:14px 14px 14px;display:flex;flex-direction:column;gap:12px">
                    <h4 style="margin:0;font:600 16px/1.3 'Source Serif 4',Georgia,serif;color:#00322B">{{ c.title }}</h4>
                    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font:400 13px/1.3 Lato,Arial,sans-serif;color:#3F3B34">
                      <li style="display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39161" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6"></path></svg><span>#{{ c.id }}</span></li>
                      <li style="display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39161" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8"></path></svg>{{ c.person }}</li>
                      <li style="display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39161" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0ZM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path></svg>{{ c.town }}</li>

            <button type="button" onClick="{{ attachComment }}" style="margin-left:auto;height:30px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#7A6A3F;font:700 13px Lato,Arial,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="background:#EDECE5"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg>{{ attachLabel }}</button>

<!-- SUBMIT WIZARD -->

  <div style="background:#fff;border:1px solid #ECE9E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,50,43,.04),0 6px 20px -8px rgba(0,50,43,.08);padding:clamp(20px,3vw,40px);animation:pageIn .3s ease-out">

      <sc-if value="{{ wz0 }}" hint-placeholder-val="{{ true }}">
        <div style="margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:20px">

              <sc-if value="{{ f.isSel }}" hint-placeholder-val="{{ false }}"><span style="position:relative;display:block"><select id="{{ f.id }}" onChange="{{ f.onChange }}" value="{{ f.value }}" aria-invalid="{{ f.inv }}" style="appearance:none;-webkit-appearance:none;width:100%;height:44px;padding:0 14px;border:1px solid #DEDBD2;border-radius:8px;background:#fff;font:400 15px Lato,Arial,sans-serif;color:#00322B;transition:border-color .15s,box-shadow .15s;padding-right:38px;cursor:pointer" style-focus="border-color:#004D44;box-shadow:0 0 0 3px rgba(0,77,68,.15)"><option value="">{{ f.ph }}</option><sc-for list="{{ f.opts }}" as="o" hint-placeholder-count="0"><option value="{{ o }}">{{ o }}</option></sc-for></select><span style="position:absolute;right:12px;top:14px;pointer-events:none;color:#565148;display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m6 9 6 6 6-6"></path></svg></span></span></sc-if>

            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ wz1 }}" hint-placeholder-val="{{ false }}">

order-color:#004D44;box-shadow:0 0 0 3px rgba(0,77,68,.15)"></div><div><label for="p-addr" style="display:block;font:700 13px/1.3 Lato,Arial,sans-serif;color:#00322B;margin-bottom:6px">Address</label><input id="p-addr" type="text" value="{{ pf.addr }}" onInput="{{ pIn.addr }}" placeholder="" style="width:100%;height:44px;padding:0 14px;border:1px solid #DEDBD2;border-radius:8px;background:#fff;font:400 15px Lato,Arial,sans-serif;color:#00322B;transition:border-color .15s,box-shadow .15s" style-focus="border-color:#004D44;box-shadow:0 0 0 3px rgba(0,77,68,.15)"></div><div><label for="p-eir" style="display:block;font:700 13px/1.3 Lato,Arial,sans-serif;color:#00322B;margin-bottom:6px">Eircode</label><input id="p-eir" type="text" value="{{ pf.eircode }}" onInput="{{ pIn.eircode }}" placeholder="" style="width:100%;height:44px;padding:0 14px;border:1px solid #DEDBD2;border-radius:8px;background:#fff;font:400 15px Lato,Arial,sans-serif;color:#00322B;transition:border-color .15s,box-shadow .15s" style-focus="border-color:#004D44;box-shadow:0 0 0 3px rgba(0,77,68,.15)"></div>
      </div>
      <div style="margin-top:22px;display:flex;justify-content:flex-end"><button type="submit" style="height:44px;padding:0 18px;background:#004D44;color:#fff;border:0;border-radius:8px;font:700 14px Lato,Arial,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s" style-hover="background:#00322B">Save changes</button></div>

      <h2 style="margin:0;font:600 18px/1.3 'Source Serif 4',Georgia,serif;color:#00322B">Notifications</h2>

<!-- REP DASHBOARD -->
<sc-if value="{{ isDash }}" hint-placeholder-val="{{ false }}">

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:16px"><sc-for list="{{ repKpis }}" as="k" hint-placeholder-count="4"><div style="background:#fff;border:1px solid #ECE9E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,50,43,.04),0 6px 20px -8px rgba(0,50,43,.08);padding:18px 20px;background:{{ k.bg }}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font:700 13px/1.3 Lato,Arial,sans-serif;color:#3F3B34">{{ k.label }}</span><span style="width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.7);color:{{ k.fg }};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="{{ k.icon }}"></path></svg></span></div><div style="margin-top:10px;font:600 32px/1 'Source Serif 4',Georgia,serif;color:{{ k.fg }};letter-spacing:-.01em">{{ k.value }}</div><div style="margin-top:6px;font:400 12px/1.4 Lato,Arial,sans-serif;color:#6B665C">{{ k.sub }}</div></div></sc-for></div>
    <div style="background:#fff;border:1px solid #ECE9E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,50,43,.04),0 6px 20px -8px rgba(0,50,43,.08);padding:clamp(18px,2.4vw,24px)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px"><h2 style="margin:0;font:600 18px/1.3 'Source Serif 4',Georgia,serif;color:#00322B">Your cases</h2><a onClick="{{ goCases }}" style="font:700 14px Lato,Arial,sans-serif;color:#004D44;cursor:pointer;display:flex;align-items:center;gap:6px">All cases<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></a></div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px">
        <sc-for list="{{ dashCols }}" as="col" hint-placeholder-count="4">
          <section style="background:#EFEEE9;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px">
            <header style="display:flex;align-items:center;gap:8px;padding:4px 4px 2px"><span style="width:8px;height:8px;border-radius:50%;background:{{ col.dot }}"></span><h3 style="margin:0;font:700 14px/1 Lato,Arial,sans-serif;color:#00322B">{{ col.name }}</h3><span style="margin-left:auto;font:700 12px/1 Lato,Arial,sans-serif;color:#565148;background:#fff;border-radius:999px;padding:5px 8px">{{ col.count }}</span></header>
            <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="1">
              <article onClick="{{ c.open }}" onKeyDown="{{ c.key }}" tabIndex="0" style="display:flex;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,50,43,.05)" style-hover="box-shadow:0 8px 20px -10px rgba(0,50,43,.3)"><img src="{{ c.img }}" alt="" style="width:52px;height:44px;border-radius:7px;object-fit:cover;flex-shrink:0"><div style="min-width:0"><div style="font:700 13px/1.3 Lato,Arial,sans-serif;color:#00322B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.title }}</div><div style="font:400 12px/1.4 Lato,Arial,sans-serif;color:#6B665C">#{{ c.id }} · {{ c.town }}</div></div></article>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start">
      <div style="background:#fff;border:1px solid #ECE9E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,50,43,.04),0 6px 20px -8px rgba(0,50,43,.08);padding:clamp(18px,2.4vw,24px);grid-column:span {{ heatSpan }};min-width:0">
        <h2 style="margin:0;font:600 18px/1.3 'Source Serif 4',Georgia,serif;color:#00322B">Geographic heat map</h2><p style="margin:4px 0 0;font:400 13px Lato,Arial,sans-serif;color:#6B665C">Cases by category and city</p>
        <div style="margin-top:16px;overflow-x:auto"><table style="width:100%;min-width:520px;border-collapse:separate;border-spacing:3px;font:400 13px Lato,Arial,sans-serif">
          <thead><tr><th style="text-align:left;padding:6px;color:#6B665C;font-weight:700"></th><sc-for list="{{ heatCities }}" as="h" hint-placeholder-count="5"><th scope="col" style="padding:6px;color:#565148;font-weight:700">{{ h }}</th></sc-for></tr></thead>
