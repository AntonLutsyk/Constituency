<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Constituency.ie — Helping Irish citizens be heard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="dc-src"><x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#F8F8F8;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
*{box-sizing:border-box}
a{color:#004D44;text-decoration:none}a:hover{color:#00322B}
button,input,select,textarea{font-family:Lato,Arial,sans-serif}
:focus-visible{outline:2px solid #FDDA0D;outline-offset:2px}
img{max-width:100%}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</helmet>
<div style="background:#F8F8F8;font:400 16px/1.6 Lato,Arial,sans-serif;color:#565148;min-height:100vh">

<a href="#main" style="position:absolute;left:-9999px;top:0" style-focus="left:16px;top:12px;z-index:100;background:#FDDA0D;color:#00322B;padding:10px 14px;font-weight:700">Skip to content</a>

<!-- ============ HEADER ============ -->
<sc-if value="{{ showChrome }}" hint-placeholder-val="{{ true }}">
<header style="position:sticky;top:0;z-index:40;background:#00322B;box-shadow:{{ hdrShadow }};transition:box-shadow .2s">
  <div style="max-width:1440px;margin:0 auto;padding:0 clamp(16px,5vw,72px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a onClick="{{ goHome }}" aria-label="Constituency.ie home" style="display:flex;cursor:pointer;flex-shrink:0"><img src="assets/logo-v2.png" alt="Constituency" style="height:44px;width:auto;display:block"></a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;align-items:stretch;height:72px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
          <a onClick="{{ n.go }}" aria-current="{{ n.current }}" style="display:flex;align-items:center;padding:0 13px;white-space:nowrap;font:700 15px/1 Lato,Arial,sans-serif;cursor:pointer;color:{{ n.color }};box-shadow:{{ n.bar }};transition:color .15s" style-hover="color:#fff;background:rgba(255,255,255,.05)">{{ n.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <div data-lang="1" style="position:relative">
          <button onClick="{{ toggleLang }}" aria-haspopup="listbox" aria-expanded="{{ langOpenStr }}" aria-label="{{ langAria }}" style="height:40px;padding:0 12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.22);border-radius:16px;color:#fff;cursor:pointer;transition:border-color .15s,background .15s" style-hover="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.08)"><span aria-hidden="true" style="width:22px;height:15px;border-radius:3px;overflow:hidden;display:flex;flex-direction:{{ langCur.dir }};flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.18)"><span style="flex:1;background:{{ langCur.c1 }}"></span><span style="flex:{{ langCur.mid }};background:{{ langCur.c2 }}"></span><span style="flex:1;background:{{ langCur.c3 }}"></span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{ langChev }};transition:transform .2s"><path d="m6 9 6 6 6-6"></path></svg></button>
          <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
            <ul role="listbox" aria-label="Language" style="list-style:none;margin:0;padding:6px;position:absolute;right:0;top:calc(100% + 8px);width:200px;background:#00322B;border:1px solid rgba(255,255,255,.12);border-radius:8px;box-shadow:0 16px 40px -12px rgba(0,0,0,.55);z-index:50;animation:fadeIn .15s ease-out">
              <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4">
                <li role="option" aria-selected="{{ l.sel }}"><button onClick="{{ l.pick }}" style="width:100%;height:44px;padding:0 12px;display:flex;align-items:center;gap:12px;background:{{ l.bg }};border:0;border-radius:6px;cursor:pointer;font:400 15px Lato,Arial,sans-serif;color:{{ l.fg }};text-align:left" style-hover="background:rgba(255,255,255,.08)"><span aria-hidden="true" style="width:22px;height:15px;border-radius:3px;overflow:hidden;display:flex;flex-direction:{{ l.dir }};flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.18)"><span style="flex:1;background:{{ l.c1 }}"></span><span style="flex:{{ l.mid }};background:{{ l.c2 }}"></span><span style="flex:1;background:{{ l.c3 }}"></span></span><span style="flex:1">{{ l.label }}</span><sc-if value="{{ l.isSel }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9B98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button></li>
              </sc-for>
            </ul>
          </sc-if>
        </div>
        <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}"><button onClick="{{ goDash }}" aria-label="Go to your dashboard" style="height:40px;padding:0 16px 0 4px;background:#A39161;border:0;color:#00322B;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border-radius:6px;font:700 15px Lato,Arial,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:background .15s" style-hover="background:#B8A472"><img src="{{ sesAv }}" alt="" style="width:32px;height:32px;border-radius:4px;object-fit:cover;display:block">Dashboard</button></sc-if>
        <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><button onClick="{{ onLogin }}" style="height:40px;padding:0 16px;background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;font:700 15px Lato,Arial,sans-serif;cursor:pointer;transition:border-color .15s" style-hover="border-color:#fff">Log in</button>
        <button onClick="{{ onSignup }}" style="height:40px;padding:0 18px;background:#A39161;border:0;color:#00322B;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border-radius:6px;font:700 15px Lato,Arial,sans-serif;cursor:pointer;transition:background .15s,box-shadow .2s,transform .1s" style-hover="background:#B8A472">Sign up</button></sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpenStr }}" aria-controls="mobile-nav" aria-label="Menu" style="width:44px;height:44px;margin-right:-8px;background:transparent;border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <sc-if value="{{ menuClosed }}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></sc-if>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
    <div id="mobile-nav" style="position:fixed;top:72px;left:0;right:0;bottom:0;background:#00322B;overflow:auto;animation:fadeIn .15s ease-out;padding:8px clamp(16px,5vw,72px) 32px;display:flex;flex-direction:column">
      <nav aria-label="Main" style="display:flex;flex-direction:column">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
          <a onClick="{{ n.go }}" aria-current="{{ n.current }}" style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid rgba(255,255,255,.1);font:500 22px/1.2 'Source Serif 4',Georgia,serif;color:#fff;cursor:pointer">{{ n.label }}<span style="width:8px;height:8px;border-radius:50%;background:{{ n.dot }}"></span></a>
        </sc-for>
      </nav>
      <div style="margin-top:20px"><div data-lang="1" style="position:relative">
          <button onClick="{{ toggleLang }}" aria-haspopup="listbox" aria-expanded="{{ langOpenStr }}" aria-label="{{ langAria }}" style="height:48px;padding:0 12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.22);border-radius:16px;color:#fff;cursor:pointer;transition:border-color .15s,background .15s" style-hover="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.08)"><span aria-hidden="true" style="width:22px;height:15px;border-radius:3px;overflow:hidden;display:flex;flex-direction:{{ langCur.dir }};flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.18)"><span style="flex:1;background:{{ langCur.c1 }}"></span><span style="flex:{{ langCur.mid }};background:{{ langCur.c2 }}"></span><span style="flex:1;background:{{ langCur.c3 }}"></span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{ langChev }};transition:transform .2s"><path d="m6 9 6 6 6-6"></path></svg></button>
          <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
            <ul role="listbox" aria-label="Language" style="list-style:none;margin:0;padding:6px;position:absolute;left:0;top:calc(100% + 8px);width:200px;background:#00322B;border:1px solid rgba(255,255,255,.12);border-radius:8px;box-shadow:0 16px 40px -12px rgba(0,0,0,.55);z-index:50;animation:fadeIn .15s ease-out">
              <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4">
                <li role="option" aria-selected="{{ l.sel }}"><button onClick="{{ l.pick }}" style="width:100%;height:44px;padding:0 12px;display:flex;align-items:center;gap:12px;background:{{ l.bg }};border:0;border-radius:6px;cursor:pointer;font:400 15px Lato,Arial,sans-serif;color:{{ l.fg }};text-align:left" style-hover="background:rgba(255,255,255,.08)"><span aria-hidden="true" style="width:22px;height:15px;border-radius:3px;overflow:hidden;display:flex;flex-direction:{{ l.dir }};flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.18)"><span style="flex:1;background:{{ l.c1 }}"></span><span style="flex:{{ l.mid }};background:{{ l.c2 }}"></span><span style="flex:1;background:{{ l.c3 }}"></span></span><span style="flex:1">{{ l.label }}</span><sc-if value="{{ l.isSel }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9B98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button></li>
              </sc-for>
            </ul>
          </sc-if>
        </div></div>
      <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:12px;margin-top:20px"><button onClick="{{ goDash }}" style="height:48px;background:#A39161;border:0;color:#00322B;border-radius:6px;font:700 16px Lato,Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px"><img src="{{ sesAv }}" alt="" style="width:28px;height:28px;border-radius:4px;object-fit:cover">Go to dashboard · {{ sesRole }}</button><button onClick="{{ logoutSite }}" style="height:48px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;font:700 16px Lato,Arial,sans-serif;cursor:pointer">Log out</button></div></sc-if>
      <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">
        <button onClick="{{ onLogin }}" style="height:48px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;font:700 16px Lato,Arial,sans-serif;cursor:pointer">Log in</button>
        <button onClick="{{ onSignup }}" style="height:48px;background:#A39161;border:0;color:#00322B;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border-radius:6px;font:700 16px Lato,Arial,sans-serif;cursor:pointer">Sign up</button>
      </div></sc-if>
    </div>
  </sc-if>
</header>
</sc-if>

<main id="main">

<!-- ============ HOME ============ -->
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<div data-screen-label="Home" style="animation:pageIn .35s ease-out">
  <section style="background:#F8F8F8;overflow:hidden">
    <div style="max-width:1440px;margin:0 auto;padding:clamp(48px,7vw,104px) clamp(16px,5vw,72px) clamp(104px,10vw,152px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(40px,5vw,80px);align-items:center">
      
      <div style="max-width:580px">
        
        <h1 style="margin:24px 0 0;font:600 clamp(40px,5vw,68px)/1.04 'Source Serif 4',Georgia,serif;letter-spacing:-.01em;color:#00322B;text-wrap:balance">Helping Irish citizens be heard</h1>
        <p style="margin:24px 0 0;font:400 clamp(17px,1.4vw,19px)/1.6 Lato,Arial,sans-serif;color:#565148;max-width:520px;text-wrap:pretty">Constituency.ie lets you track, manage and resolve civic issues with your elected representatives in a modern, transparent way.</p>
        <div style="margin-top:36px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
          <button onClick="{{ goContact }}" style="height:52px;padding:0 24px;background:#004D44;color:#fff;border:0;box-shadow:0 1px 2px rgba(0,50,43,.24),inset 0 1px 0 rgba(255,255,255,.12);border-radius:6px;font:700 16px Lato,Arial,sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s,box-shadow .2s,transform .1s" style-hover="background:#00322B;box-shadow:0 10px 22px -10px rgba(0,50,43,.6),inset 0 1px 0 rgba(255,255,255,.12)" style-active="transform:translateY(1px)">Contact us</button>
          <button onClick="{{ goCases }}" style="height:52px;padding:0 22px;background:#fff;color:#00322B;border:1px solid #C8C4B8;box-shadow:0 1px 2px rgba(0,50,43,.06);border-radius:6px;font:700 16px Lato,Arial,sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s" style-hover="border-color:#004D44">Explore public cases<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
        <div style="margin-top:48px;display:flex;align-items:center;gap:16px"><img src="assets/iso-badge.png" alt="ISO/IEC 27001 certified by West Assured" style="width:96px;height:auto;display:block;flex-shrink:0"><div style="padding-left:16px;border-left:1px solid #DEDBD2"><div style="font:700 14px/1.3 Lato,Arial,sans-serif;color:#00322B">ISO/IEC 27001 certified</div><div style="margin-top:2px;font:400 13px/1.4 Lato,Arial,sans-serif;color:#6B665C">Information security management</div></div></div>
      </div><figure style="margin:0;position:relative;padding:0 0 clamp(32px,5vw,64px) clamp(24px,4vw,56px)">
        <div aria-hidden="true" style="position:absolute;left:18%;right:-12px;top:-28px;bottom:clamp(8px,2vw,24px);background:#E3ECE8;border-radius:16px"></div>
        <div style="position:relative;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 4px 10px rgba(0,50,43,.05),0 36px 72px -28px rgba(0,50,43,.34)">
          <img src="assets/scr-dash.png" alt="Representative dashboard showing case counts and a kanban of open cases" style="width:100%;aspect-ratio:16/10;display:block;object-fit:cover;object-position:top left">
        </div>
        <div style="position:absolute;left:0;bottom:0;width:44%;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 4px 10px rgba(0,50,43,.05),0 36px 72px -28px rgba(0,50,43,.34);outline:1px solid rgba(0,50,43,.06)">
          <img src="assets/scr-analytics.png" alt="Analytics screen" style="width:100%;aspect-ratio:16/10;display:block;object-fit:cover;object-position:top left">
        </div>
      </figure>
    </div>
  </section>

  <section style="position:relative;z-index:1;margin-top:-56px;background:linear-gradient(to bottom,transparent 56px,#F8F8F8 56px)">
    <div style="max-width:1440px;margin:0 auto;padding:0 clamp(16px,5vw,72px)">
    <div style="border-radius:16px;overflow:hidden;background:#ECE9E1;box-shadow:0 2px 4px rgba(0,50,43,.04),0 18px 40px -16px rgba(0,50,43,.22);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1px">
      <sc-for list="{{ values }}" as="v" hint-placeholder-count="3">
        <div style="background:#fff;padding:clamp(24px,3vw,36px)">
          <div style="width:48px;height:48px;border-radius:8px;background:#E6EFEC;display:flex;align-items:center;justify-content:center"><img src="{{ v.icon }}" alt="" style="width:24px;height:24px;display:block"></div>
          <h3 style="margin:20px 0 0;font:600 22px/1.3 'Source Serif 4',Georgia,serif;color:#00322B">{{ v.title }}</h3>
          <p style="margin:8px 0 0;font:400 16px/1.6 Lato,Arial,sans-serif;color:#565148;max-width:34ch">{{ v.desc }}</p>
        </div>
      </sc-for>
    </div>
    </div>
  </section>

  

  
  <section style="background:#F8F8F8">
    <div style="max-width:1440px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(16px,5vw,72px)">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 40px">
        <div style="max-width:640px">
          <h2 style="margin:0;font:500 clamp(30px,3.4vw,44px)/1.12 'Source Serif 4',Georgia,serif;color:#00322B;letter-spacing:-.01em">Public cases</h2>
          <p style="margin:14px 0 0;font:400 17px/1.65 Lato,Arial,sans-serif;color:#565148">Explore how real citizens and public representatives work together to create local impact across Ireland.</p>
        </div>
        <a onClick="{{ goCases }}" style="font:700 16px/1 Lato,Arial,sans-serif;color:#004D44;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 0" style-hover="color:#00322B;text-decoration:underline">See all public cases<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></a>
      </div>
      <div style="margin-top:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px">
        <sc-for list="{{ homeCases }}" as="c" hint-placeholder-count="3">
          <article onClick="{{ c.open }}" onKeyDown="{{ c.key }}" tabIndex="0" aria-label="{{ c.aria }}" style="background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 1px 2px rgba(0,50,43,.04),0 6px 20px -8px rgba(0,50,43,.10);transition:box-shadow .25s,transform .25s" style-hover="box-shadow:0 2px 4px rgba(0,50,43,.04),0 18px 40px -16px rgba(0,50,43,.22);transform:translateY(-3px)">
            <div style="position:relative">
              <img src="{{ c.img }}" alt="" style="width:100%;aspect-ratio:16/7;object-fit:cover;display:block">
              <span style="position:absolute;left:14px;top:14px;max-width:calc(100% - 150px);font:700 12px/1.2 Lato,Arial,sans-serif;color:#fff;background:{{ c.catBg }};padding:6px 10px;border-radius:6px">{{ c.tag }}</span>
              <span style="position:absolute;right:14px;top:14px;font:700 12px/1 Lato,Arial,sans-serif;color:{{ c.stFg }};background:{{ c.stBg }};padding:7px 10px;border-radius:999px">{{ c.status }}</span>
            </div>
            <div style="padding:18px 20px 20px;display:flex;flex-direction:column;flex:1">
              <div style="display:flex;gap:12px;align-items:flex-start">
                <div style="flex:1;min-width:0">
                  <h3 style="margin:0;font:500 19px/1.3 'Source Serif 4',Georgia,serif;color:#00322B;text-wrap:pretty">{{ c.title }}</h3>
                  <p style="margin:8px 0 0;font:400 14px/1.5 Lato,Arial,sans-serif;color:#565148;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ c.desc }}</p>
                </div>
                <div style="display:flex;gap:8px;flex-shrink:0">
                  <button onClick="{{ c.toggleSave }}" aria-pressed="{{ c.savedStr }}" aria-label="{{ c.saveLabel }}" style="width:40px;height:40px;border-radius:50%;border:1px solid #ECE9E1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s;background:{{ c.saveBg }};color:{{ c.saveFg }}" style-hover="border-color:#004D44"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ c.saveFill }}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg></button>
                  <button onClick="{{ c.share }}" aria-label="Share case" style="width:40px;height:40px;border-radius:50%;border:1px solid #ECE9E1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s;background:#fff;color:#00322B" style-hover="border-color:#004D44"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></button>
                </div>
              </div>

const NEWS_BODY = {"Constituency Officially Launches":{"hero":"https://baldi-na-public.s3.eu-west-1.amazonaws.com/images/JPG/scene12.jpg","read":"3 min read","b":[["p","Constituency has officially launched today, 1 May 2026, marking the public introduction of a platform that has been built over a substantial period with a clear and deliberate focus on transparency, clarity and trust in political engagement."],["p","The launch represents the culmination of extensive planning, development and real world testing. Rather than entering the market quickly, Constituency has taken a measured and considered approach, ensuring the platform is built on strong and reliable foundations before opening it to a wider audience."],["p","Developed as the world’s first dedicated constituency platform, Constituency has been designed to support modern political representation by presenting clear and structured information for citizens and public representatives alike. The platform responds to the realities of population growth, increasing constituent engagement and the rising demands placed on elected officials."],["p","Founder and CEO Jason Howley said the decision to launch today reflects years of work carried out away from the spotlight."],["q","Constituency was never about launching fast. It was about launching right. When you are dealing with representation and public trust, taking the time to build the platform properly is essential."],["p","From its earliest stages, Constituency focused on operating transparently and responsibly. This included live constituency trials, clear governance processes and the implementation of rigorous information security controls, ensuring the platform could operate with confidence from day one."],["p","Jason described today’s launch as the beginning of a wider journey rather than a conclusion."],["q","Today marks the launch of Constituency, but it is only the starting point. The platform has been built to grow in a considered way, supporting transparency and access to information at every level."],["p","Constituency launches as a self regulated organisation with openness and oversight embedded into its core design. The platform is structured to evolve alongside political systems while maintaining clear, accessible and trustworthy information for users."],["p","The long term ambition for Constituency is to expand internationally, supporting political engagement across different regions while respecting local traditions and democratic structures."],["q","Political systems may differ from country to country, but the need for transparency and clear information is universal. Constituency has been built with that principle at its heart."],["p","Today’s launch marks a significant milestone for Constituency and introduces a new approach to constituency engagement. Built with patience, purpose and care, the platform enters the public space with a strong foundation and a clear vision for the future."]]},"Constituency Strengthens Payment Security with PCI DSS Certification":{"hero":"https://baldi-na-public.s3.eu-west-1.amazonaws.com/images/webp/news-pci-article.webp","read":"4 min read","date":"7 August 2026","b":[["p","At Constituency, protecting the information entrusted to us is one of our highest priorities. We are pleased to announce that Constituency now operates with PCI DSS certified payment processing through our payment provider, Stripe. This latest achievement strengthens our commitment to delivering a secure, trusted and transparent platform for citizens, representatives, organisations and communities."],["p","This milestone builds upon our existing security and compliance programme, including our ISO 27001 certification, privacy-focused design principles and ongoing investment in information security and risk management."],["h","What is PCI DSS?"],["p","PCI DSS stands for the Payment Card Industry Data Security Standard. It is a globally recognised security standard designed to help organisations protect payment card information and securely process payment transactions. PCI DSS establishes a comprehensive set of security requirements aimed at reducing the risk of payment fraud, unauthorised access and data breaches."],["p","The standard is used throughout the global payments industry by organisations that process, transmit or facilitate payment card transactions."],["h","What this means for Constituency users"],["p","For citizens, representatives and organisations using Constituency, this certification provides additional assurance that payment transactions are handled through a secure and independently assessed payment environment. Payment card information is processed through Stripe’s secure infrastructure and is not stored within Constituency systems."],["p","Key benefits include:"],["l",["Secure payment processing","Enhanced protection of payment information","Industry recognised security controls","Ongoing security and compliance oversight","Reduced risk of payment fraud","Increased confidence when making online payments"]],["h","How Constituency approaches payment security"],["p","Constituency has been designed so that sensitive payment card information is entered directly into Stripe’s secure payment environment. We do not store:"],["l",["Payment card numbers","Card verification values (CVV/CVC)","Magnetic stripe data"]],["p","This approach reduces risk and helps ensure sensitive payment information remains within Stripe’s secure payment infrastructure. We also maintain oversight of our payment service provider and review relevant security and compliance information to support the secure processing of payment transactions."],["h","Security and transparency remain a priority"],["p","Security is not a one-time achievement. It is an ongoing commitment. Constituency continues to invest in:"],["l",["Information security","Data protection","Privacy by design","Risk management","Compliance and governance","Platform security improvements","Transparent communication"]],["h","Why this matters"],["p","Trust is earned through transparency. As the world’s first digital constituency platform, Constituency is committed to providing a secure environment where citizens and representatives can engage confidently."],["p","Our compliance journey is not simply about certifications. It is about creating a platform that citizens, representatives and organisations can trust when sharing information, collaborating on issues and engaging in democratic participation."]]},"Constituency Awarded ISO IEC 27001 Certification":{"hero":"https://baldi-na-public.s3.eu-west-1.amazonaws.com/images/JPG/scene11.jpg","read":"3 min read","date":"29 April 2026","b":[["p","Constituency has been formally awarded ISO IEC 27001 certification, marking a major milestone for the organisation and reinforcing its commitment to the highest standards of information security, governance and operational resilience."],["p","ISO IEC 27001 is the internationally recognised standard for information security management systems, often referred to as an ISMS. It provides a comprehensive framework for how organisations identify risks, protect sensitive information and ensure the ongoing confidentiality, integrity and availability of data."],["p","Achieving this certification confirms that Constituency has implemented robust technical and organisational controls to manage information securely. The independent audit process assessed how the organisation approaches risk management, access control, data handling, incident response, supplier oversight and continuous improvement."],["p","As a self regulated organisation and the world’s first dedicated constituency platform, Constituency operates in an environment where trust and accountability are essential. The platform has been designed to support political representation and constituency engagement, making rigorous security measures a foundational requirement rather than a later addition."],["p","Jason Howley, Founder and CEO of Constituency, said the certification reflects how the platform has been developed from the outset."],["q","ISO IEC 27001 is not something you achieve by chance. It reflects the way Constituency has been built from day one, with security, responsibility and governance treated as core principles. For a platform operating in political and constituency contexts, protecting information and earning trust is not optional, it is essential."],["p","He added that ISO IEC 27001 certification is not a final destination, but an ongoing commitment."],["q","This certification brings with it continued responsibility. Maintaining ISO IEC 27001 means constant review, improvement and vigilance, ensuring Constituency remains resilient as it grows and evolves."],["p","ISO IEC 27001 also requires ongoing compliance, with regular internal audits, risk reviews and independent surveillance audits to ensure controls remain effective and responsive to emerging threats."],["p","For users of the platform, including citizens, representatives and organisations, the certification provides independent assurance that Constituency operates to internationally recognised best practice standards and treats the protection of information with the seriousness it demands."],["p","As Constituency continues to expand, ISO IEC 27001 certification forms a central part of its long term commitment to transparency, trust and responsible innovation in modern political engagement."]]},"Constituency Progresses to ISO 27001 Stage 2 Audit":{"hero":"https://baldi-na-public.s3.eu-west-1.amazonaws.com/images/jpeg/scenary_1.jpg","read":"3 min read","date":"8 April 2026","b":[["p","Constituency is pleased to confirm that it has successfully completed its ISO 27001 Stage 1 audit and has been formally recommended to proceed to the final Stage 2 certification audit. This represents a significant milestone in Constituency’s ongoing commitment to the highest standards of information security, governance, and trust."],["p","Following the successful Stage 1 assessment, the Stage 2 audit will take place on the 13th and 15th of April 2026. This final stage will determine the outcome of Constituency’s ISO 27001 certification and marks an important step towards full compliance with the internationally recognised Information Security Management Systems standard."],["p","The Stage 2 audit is designed to validate that Constituency’s information security controls are not only well designed but are fully implemented and operating effectively across the organisation. The audit will focus on how information security is embedded within everyday operations, decision making, and service delivery."],["p","As part of the audit scope, Constituency will be assessed on the design, development, hosting, delivery, and ongoing support of the cloud based Constituency platform. This includes the associated information assets, systems, and business processes that underpin the platform, as well as the protection of personal and organisational data processed within the service environment."],["p","Successfully progressing to Stage 2 reflects the strength of the foundations established during Stage 1 and demonstrates that Constituency’s policies, procedures, and risk management approach align with ISO 27001 requirements."],["p","As the final audit dates approach, the team is both excited and focused as it works towards completing this important process. Constituency looks forward to the outcome of the Stage 2 audit and to progressing towards the official launch of a platform built with security, integrity, and compliance at its core."]]},"Constituency Commences ISO 27001 Security & Compliance Processes":{"hero":"https://baldi-na-public.s3.eu-west-1.amazonaws.com/images/jpeg/scenary_3.jpg","read":"3 min read","date":"9 March 2026","b":[["p","March 2026 marked a significant milestone for Constituency as the organisation formally commenced its ISO 27001 information security processes on 9th and 19th March 2026, reinforcing its commitment to trust, transparency and robust security."],["p","As the world’s first self regulated Constituency platform, Constituency operates in an environment where information protection and platform integrity are fundamental. Beginning the ISO 27001 journey represents a deliberate step to strengthen existing security practices while aligning with internationally recognised standards for information security management."],["h","What is ISO 27001"],["p","ISO 27001 is the leading international standard for Information Security Management Systems. It provides a structured and disciplined framework that enables organisations to identify information security risks, implement appropriate controls and continually improve how information is protected."],["h","Why ISO 27001 is important for Constituency"],["p","Constituency sits at the centre of civic engagement, data insight and digital participation, where confidence and trust are essential. By formally adopting ISO 27001 processes, Constituency is strengthening how information is protected across the organisation, improving resilience against security threats, and demonstrating transparency and accountability to users, partners and stakeholders."],["h","March 2026 milestones"],["p","The sessions held on 9th and 19th March 2026 marked the formal launch of ISO 27001 activities within Constituency. These sessions focused on defining scope, assessing information security risks, reviewing governance structures and initiating the development of an Information Security Management System tailored to the platform."],["h","Stage 2 audit scheduled"],["p","The ISO 27001 Stage 2 audit is scheduled for the 13th and 15th of April 2026. This stage represents the final phase of the formal audit process and will assess the effectiveness of Constituency’s Information Security Management System in operation."],["h","Looking ahead"],["p","The commencement of ISO 27001 is not a one off exercise but an ongoing commitment to continual improvement. As Constituency progresses through certification and beyond, the organisation will continue to review, adapt and strengthen its security posture in line with evolving risks and platform growth."]]}};
